<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kirjutaja</title>
<meta name="theme-color" content="#fdfdfa">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/harjutaja-ikoon-ummar.svg" type="image/svg+xml">
<link rel="icon" href="../icons/harjutaja-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../icons/harjutaja-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="kirjutaja.css">
</head>
<body>
<main class="app">

<section id="s-home" class="screen">
  <header class="top">
    <a class="back" href="../">‹ Harjutaja</a>
    <button class="icon-btn" id="sfxBtn" aria-pressed="true" aria-label="Heliefektid"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7"/><path class="off" d="M16 9l5 6M21 9l-5 6"/></svg></button>
  </header>
  <div class="hero">
    <button class="mascot" id="mascot" aria-label="Robot"></button>
    <h1>Kirjutaja</h1>
    <p class="sub">Kuula sõna ja vali, mis tähed lünka käivad.</p>
  </div>
  <div class="block">
    <span class="label" id="lblSet">Milliseid tähti harjutad?</span>
    <div class="chips" role="group" aria-labelledby="lblSet" id="sets">
      <button class="chip" data-set="all" aria-pressed="true">Kõik</button>
      <button class="chip" data-set="k" aria-pressed="false">g · k · kk</button>
      <button class="chip" data-set="p" aria-pressed="false">b · p · pp</button>
      <button class="chip" data-set="t" aria-pressed="false">d · t · tt</button>
    </div>
  </div>
  <button class="primary big" id="startBtn">Harjuta</button>
  <div class="block">
    <span class="label">Häälikukaart</span>
    <div class="map" id="map" role="grid" aria-label="Häälikukaart"></div>
    <p class="hint-small" id="mapHint">Roheline tähendab, et need sõnad on juba selged. Puuduta ruutu, kui tahad harjutada ainult selle ruudu sõnu.</p>
  </div>
  <p class="count-note" id="countNote"></p>
</section>

<section id="s-game" class="screen" hidden>
  <header class="top">
    <button class="icon-btn" id="quitBtn" aria-label="Lõpeta ring">✕</button>
    <div class="track"><i id="bar"></i></div>
  </header>
  <div class="stage">
    <button class="listen" id="listenBtn" aria-label="Kuula uuesti">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
    <p class="sentence" id="sentence" aria-live="polite"></p>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <div class="hintcard" id="hint" hidden></div>
    <div class="row" id="after" hidden>
      <button class="ghost" id="allBtn">Kuula kõiki</button>
      <button class="primary" id="nextBtn">Edasi</button>
    </div>
  </div>
</section>

<section id="s-result" class="screen" hidden>
  <div class="res-hero">
    <div class="bubble" id="resTitle"></div>
    <div id="resRobot"></div>
    <p class="sub" id="resSub"></p>
  </div>
  <div class="stats" id="resStats"></div>
  <div class="block" id="resNextBlock" hidden>
    <span class="label">Järgmisel korral harjutame</span>
    <div class="words" id="resNext"></div>
  </div>
  <div class="row">
    <button class="primary big" id="againBtn">Harjuta veel</button>
    <button class="ghost" id="homeBtn">Koju</button>
  </div>
</section>

</main>
<script src="../core/store.js"></script>
<script src="../core/sfx.js"></script>
<script src="../core/engine.js"></script>
<script src="data.js"></script>
<script src="robot.js"></script>
<script src="app.js"></script>
</body>
</html>
