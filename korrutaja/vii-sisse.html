<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Võta edenemine vastu</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../icons/harjutaja-ikoon-ummar.svg" type="image/svg+xml">
<style>
:root{--paper:#fdfdfa;--ink:#1d2f4f;--ink2:#5a6a82;--edge:#c3d4ea;--card:#fff;
  --sun:#f3c445;--sun-edge:#e9b93f;--sun-ink:#3a2c00;--ok:#1d7f53;--ok-bg:#e3f5ec;--bad:#b8432d;--bad-bg:#fbe9e4;
  --fb:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.5;
  padding:28px 16px 60px}
main{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.mark{width:64px;height:64px;border-radius:22.5%;display:block;margin:0 auto}
h1{font-size:26px;line-height:1.15;margin:0;text-align:center;font-weight:800}
p{margin:0}
.lead{color:var(--ink2);text-align:center}
.card{background:var(--card);border:1.5px solid var(--edge);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:0;font-weight:800}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
dt{color:var(--ink2)}
dd{margin:0;font-weight:700;text-align:right}
button,a.btn{font:inherit;font-weight:800;border-radius:12px;padding:13px 18px;cursor:pointer;border:1.5px solid var(--edge);
  background:var(--card);color:var(--ink);text-align:center;text-decoration:none;display:block;width:100%}
a.btn.go,button.go{background:var(--sun);border-color:var(--sun-edge);color:var(--sun-ink);font-size:18px}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
textarea{font:13px ui-monospace,Consolas,monospace;width:100%;min-height:96px;border:1.5px solid var(--edge);border-radius:12px;padding:10px;background:var(--paper);color:var(--ink);resize:vertical}
.note{font-size:14px;color:var(--ink2)}
.msg{border-radius:12px;padding:12px 14px;font-weight:700}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.bad{background:var(--bad-bg);color:var(--bad)}
.row{display:flex;gap:10px}
.row button{flex:1}
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 100 100" role="img" aria-label="Harjutaja">
    <rect width="100" height="100" rx="22.5" fill="#f3c445"/>
    <path d="M28 24V76M38 24V76M62 24V76M72 24V76" fill="none" stroke="#16284a" stroke-width="8.6" stroke-linecap="round"/>
    <path d="M38 56L62 44" fill="none" stroke="#16284a" stroke-width="8.6" stroke-linecap="round"/>
  </svg>

  <h1>Võta edenemine vastu</h1>
  <p class="lead" id="lead">Siia jõuab sinu Korrutaja edenemine vanalt aadressilt.</p>

  <div id="app"></div>
</main>

<script>
(function () {
  var KEY = 'korrutaja_v1';
  var app = document.getElementById('app');

  function el(html) { var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

  function unb64url(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s), u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return u8;
  }

  // Voog loetakse kasitsi. Response(stream) ei tooda koigis brauserites.
  function streamThrough(u8, stream) {
    var w = stream.writable.getWriter();
    w.write(u8); w.close();
    var r = stream.readable.getReader(), chunks = [], total = 0;
    return (function pump() {
      return r.read().then(function (res) {
        if (res.done) {
          var out = new Uint8Array(total), o = 0;
          for (var i = 0; i < chunks.length; i++) { out.set(chunks[i], o); o += chunks[i].length; }
          return out;
        }
        chunks.push(res.value); total += res.value.length;
        return pump();
      });
    })();
  }

  function unpack(payload) {
    var tag = payload.slice(0, 3), data = payload.slice(3);
    var u8;
    try { u8 = unb64url(data); } catch (e) { return Promise.reject(new Error('kood on katki')); }
    if (tag === 'k0.') return Promise.resolve(new TextDecoder().decode(u8));
    if (tag !== 'k1.') return Promise.reject(new Error('tundmatu kood'));
    if (typeof DecompressionStream === 'undefined') return Promise.reject(new Error('see brauser ei oska pakitud koodi lahti teha'));
    return streamThrough(u8, new DecompressionStream('gzip'))
      .then(function (out) { return new TextDecoder().decode(out); });
  }

  function kokkuvote(D) {
    var paevi = D.days ? Object.keys(D.days).length : 0;
    var vastuseid = (D.total && D.total.n) || 0;
    var voistlusi = (D.tests && D.tests.length) || 0;
    var cls = D.cls;
    return '<dl>'
      + '<dt>Harjutatud päevi</dt><dd>' + paevi + '</dd>'
      + '<dt>Vastuseid kokku</dt><dd>' + vastuseid + '</dd>'
      + '<dt>Võistlusi</dt><dd>' + voistlusi + '</dd>'
      + (cls ? '<dt>Klass</dt><dd>' + esc(cls.class_name || cls.code || '—') + '</dd><dt>Hüüdnimi</dt><dd>' + esc(cls.nick || '—') + '</dd>' : '')
      + '</dl>';
  }

  function kirjuta(json, D) {
    try { localStorage.setItem(KEY, json); }
    catch (e) { app.append(el('<div class="msg bad">Salvestamine ei õnnestunud. Brauser ei luba andmeid hoida.</div>')); return; }
    if (location.hash) history.replaceState(null, '', location.pathname);
    app.innerHTML = '';
    app.append(el('<div class="msg ok">Valmis! Sinu edenemine on nüüd Harjutajas.</div>'));
    app.append(el('<div class="card"><h2>Üle tuli</h2>' + kokkuvote(D) + '</div>'));
    app.append(el('<a class="btn go" href="../">Ava Harjutaja</a>'));
  }

  function paku(json) {
    var D;
    try { D = JSON.parse(json); } catch (e) { D = null; }
    if (!D || typeof D !== 'object' || (!D.days && !D.q && !D.cls && !D.total)) {
      app.innerHTML = '';
      app.append(el('<div class="msg bad">See kood ei näe Korrutaja edenemise moodi välja. Kontrolli, et kopeerisid terve koodi.</div>'));
      return;
    }
    var olemas = null;
    try { olemas = localStorage.getItem(KEY); } catch (e) {}

    app.innerHTML = '';
    app.append(el('<div class="card"><h2>Mis üle tuleb</h2>' + kokkuvote(D) + '</div>'));

    if (!olemas) { kirjuta(json, D); return; }

    var vana = null;
    try { vana = JSON.parse(olemas); } catch (e) {}
    app.append(el('<div class="msg bad">Siin on juba Korrutaja andmed. Vali, kumbad alles jäävad — teised kustuvad.</div>'));
    if (vana) app.append(el('<div class="card"><h2>Praegu siin</h2>' + kokkuvote(vana) + '</div>'));
    var row = el('<div class="row"></div>');
    var uus = el('<button type="button" class="go">Võta uued</button>');
    var jaa = el('<button type="button">Jäta vanad</button>');
    uus.onclick = function () { kirjuta(json, D); };
    jaa.onclick = function () {
      if (location.hash) history.replaceState(null, '', location.pathname);
      app.innerHTML = '';
      app.append(el('<div class="msg ok">Jätsin vanad andmed alles.</div>'));
      app.append(el('<a class="btn go" href="../">Ava Harjutaja</a>'));
    };
    row.append(uus, jaa); app.append(row);
  }

  function kasitle(payload) {
    app.innerHTML = '<p class="note">Pakin lahti…</p>';
    unpack(payload).then(paku, function (err) {
      app.innerHTML = '';
      app.append(el('<div class="msg bad">Ei saanud koodi lahti: ' + esc(err.message) + '.</div>'));
      kasitsi();
    });
  }

  function kasitsi() {
    var card = el('<div class="card"><h2>Kleebi kood</h2></div>');
    card.append(el('<p class="note">Kopeeri kood vanalt aadressilt lehelt <b>korrutaja.silverjaanus.com/vii-ule.html</b> ja kleebi see siia.</p>'));
    var ta = document.createElement('textarea');
    ta.setAttribute('aria-label', 'Üleviimise kood');
    ta.placeholder = 'k1.…';
    card.append(ta);
    var b = el('<button type="button" class="go">Võta vastu</button>');
    b.onclick = function () {
      var v = ta.value.trim();
      if (!v) return;
      kasitle(v);
    };
    card.append(b);
    app.append(card);
  }

  var m = /(?:^|[#&])vii=([^&]+)/.exec(location.hash || '');
  if (m) kasitle(decodeURIComponent(m[1]));
  else {
    document.getElementById('lead').textContent = 'Ava see leht vanal aadressil oleva nupu kaudu, või kleebi kood siia.';
    kasitsi();
  }
})();
</script>
</body>
</html>
